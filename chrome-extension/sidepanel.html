<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="sidepanel.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <title>OTT Assistant</title>
</head>
<body>
  <div class="header">
    <span>OTT Assistant</span>
    <div class="header-actions">
      <button id="theme-toggle" title="Toggle Theme">🌙</button>
      <button id="clear-btn" title="Clear Chat">Clear</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="loading" class="hidden">
    <div class="spinner"></div> Assistant is thinking...
  </div>

  <div class="input-container">
    <textarea id="message-input" placeholder="Ask about FFmpeg, ABR, DRM..." rows="2"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
